name: login_form_ui
description: "A new Flutter project."
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_svg: ^2.3.0
  google_fonts: ^8.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^6.0.0


flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/



  fonts:
    - family: Prime
      fonts:
        - asset: assets/fonts/Prime-Light.otf
        - asset: assets/fonts/Prime-Regular.otf
          style: italic
